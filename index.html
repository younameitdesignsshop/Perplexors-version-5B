const PUZZLES=[{"id":"v11-beginner","level":"Beginner","title":"Aquarium Breakfast","story":"Four aquarium keepers\u2014Mara, Noel, Owen, and Pia\u2014each fed a different animal group at a different time and used a bucket with a different label. Match each keeper with the animal, feeding time, and bucket label.","slots":["Mara","Noel","Owen","Pia"],"categories":["Feeding Time","Animal","Bucket Label"],"values":{"Feeding Time":["9:00","9:20","9:40","10:00"],"Animal":["Otters","Penguins","Seals","Turtles"],"Bucket Label":["Shells","Waves","Stars","Reeds"]},"clues":["Owen had 9:00 for feeding time.","Mara had Stars for bucket label.","Noel had Turtles for animal.","The Reeds bucket was used at 10:00.","Pia had Shells for bucket label.","The seals were fed at 9:40.","Pia did not have 9:20 for feeding time.","The penguins used the bucket labeled Stars.","Noel did not have Seals for animal."],"solution":{"Mara":{"Feeding Time":"9:20","Animal":"Penguins","Bucket Label":"Stars"},"Noel":{"Feeding Time":"10:00","Animal":"Turtles","Bucket Label":"Reeds"},"Owen":{"Feeding Time":"9:00","Animal":"Otters","Bucket Label":"Waves"},"Pia":{"Feeding Time":"9:40","Animal":"Seals","Bucket Label":"Shells"}},"hint":"Look for clues that connect two categories, then use exclusions to force the remaining matches."},{"id":"v11-easy","level":"Easy","title":"Saturday Antique Hunt","story":"Avery, Bianca, Cole, and Dev each found one antique at a different booth and paid a different price. The prices were $24, $28, $32, and $36. Determine each shopper\u2019s find, booth, and price.","slots":["Avery","Bianca","Cole","Dev"],"categories":["Price","Find","Booth"],"values":{"Price":["$24","$28","$32","$36"],"Find":["Clock","Lantern","Mirror","Vase"],"Booth":["Arcade","Courtyard","Gallery","Loft"]},"clues":["Cole had $36 for price.","Cole had Clock for find.","Cole had Loft for booth.","Avery had $32 for price.","Bianca had Lantern for find.","Bianca had Courtyard for booth.","The vase came from the Arcade booth.","Dev did not have $24 for price.","Dev had Arcade for booth.","Cole did not have Gallery for booth."],"solution":{"Avery":{"Price":"$32","Find":"Mirror","Booth":"Gallery"},"Bianca":{"Price":"$24","Find":"Lantern","Booth":"Courtyard"},"Cole":{"Price":"$36","Find":"Clock","Booth":"Loft"},"Dev":{"Price":"$28","Find":"Vase","Booth":"Arcade"}},"hint":"Look for clues that connect two categories, then use exclusions to force the remaining matches."},{"id":"v11-medium","level":"Medium","title":"Robot Rally","story":"Four robotics teams\u2014Kite, Nova, Pulse, and Rivet\u2014finished first through fourth. Each robot featured a different specialty and carried a different battery capacity. First place is the best finish; the team names are not listed in finishing order.","slots":["Kite","Nova","Pulse","Rivet"],"categories":["Place","Robot Feature","Battery"],"values":{"Place":["1st","2nd","3rd","4th"],"Robot Feature":["Claw","Camera","Lift","Sensor"],"Battery":["40Wh","50Wh","60Wh","70Wh"]},"clues":["Rivet used a battery 10Wh smaller than Nova\u2019s.","The camera robot finished before the sensor robot, but not necessarily immediately before.","Kite did not use the claw or lift.","The lift robot used a larger battery than the claw robot.","Kite did not have 70Wh for battery.","Kite did not have 40Wh for battery.","Kite did not have 60Wh for battery.","Pulse did not have Claw for robot feature.","Nova did not have 2nd for place.","Nova did not have 4th for place.","Kite did not have 4th for place.","Kite did not have 1st for place.","Kite did not have 2nd for place.","Pulse did not have 2nd for place.","Rivet did not have 3rd for place."],"solution":{"Kite":{"Place":"3rd","Robot Feature":"Camera","Battery":"50Wh"},"Nova":{"Place":"1st","Robot Feature":"Lift","Battery":"70Wh"},"Pulse":{"Place":"4th","Robot Feature":"Sensor","Battery":"40Wh"},"Rivet":{"Place":"2nd","Robot Feature":"Claw","Battery":"60Wh"}},"hint":"Look for clues that connect two categories, then use exclusions to force the remaining matches."},{"id":"v11-hard","level":"Hard","title":"Faculty Challenge","story":"Five teachers\u2014Mara, Nolan, Priya, Quentin, and Rosa\u2014each teach at a different school, teach a different subject, have a different faculty nickname, and have a different number of years of experience. Experience values are 4, 7, 10, 13, and 16 years.","slots":["Mara","Nolan","Priya","Quentin","Rosa"],"categories":["School","Subject","Nickname","Experience"],"values":{"School":["Adams","Benton","Cedar","Dover","Elm"],"Subject":["Art","History","Math","Music","Science"],"Nickname":["Captain","Coach","Professor","Scout","Whiz"],"Experience":["4 years","7 years","10 years","13 years","16 years"]},"clues":["The Cedar teacher has exactly 6 more years of experience than the music teacher.","The person nicknamed Coach teaches history.","Priya has more experience than Nolan but less than Rosa.","The Adams teacher is neither the math teacher nor Professor.","The science teacher has exactly 3 more years of experience than Quentin.","Mara teaches neither art nor history.","The Dover teacher is nicknamed Scout.","The math teacher has less experience than Coach, not necessarily exactly 3 years less.","Nolan does not teach at Benton or Elm and is not Whiz.","The teacher with 16 years of experience works at Elm.","Professor has exactly 3 fewer years of experience than the Benton teacher.","Rosa is neither the science teacher nor Captain.","Captain has less experience than Scout.","Quentin teaches at Cedar, and Mara teaches at Benton.","The art teacher has less experience than Professor."],"solution":{"Mara":{"School":"Benton","Subject":"Science","Nickname":"Whiz","Experience":"13 years"},"Nolan":{"School":"Adams","Subject":"Music","Nickname":"Captain","Experience":"4 years"},"Priya":{"School":"Dover","Subject":"Art","Nickname":"Scout","Experience":"7 years"},"Quentin":{"School":"Cedar","Subject":"Math","Nickname":"Professor","Experience":"10 years"},"Rosa":{"School":"Elm","Subject":"History","Nickname":"Coach","Experience":"16 years"}},"hint":"Build the experience chain first. The school and nickname relationships do not settle the subjects until several experience possibilities have been eliminated."},{"id":"v11-expert","level":"Expert","title":"Deep Sea Expedition","story":"Five divers\u2014Elena, Marcus, Nadia, Owen, and Priya\u2014each made a different dive in a different order, explored a different zone, found a different object, and reached a different maximum depth. Dive 1 happened first and Dive 5 happened last. The depths were 40, 50, 60, 70, and 80 feet.","slots":["Elena","Marcus","Nadia","Owen","Priya"],"categories":["Dive Order","Zone","Discovery","Depth"],"values":{"Dive Order":["1","2","3","4","5"],"Zone":["Cave","Kelp","Reef","Trench","Wreck"],"Discovery":["Bell","Camera","Coin","Compass","Tablet"],"Depth":["40 ft","50 ft","60 ft","70 ft","80 ft"]},"clues":["The Wreck diver went exactly 10 feet deeper than the Coin finder.","Priya dove after Marcus but before Nadia; neither relationship was necessarily immediate.","The Tablet was found on the deepest dive.","Nadia explored neither the Cave nor the Wreck and did not find the Coin.","The Kelp diver went exactly 10 feet shallower than the Wreck diver.","The Reef dive happened before the dive that found the Bell, not necessarily immediately before.","Elena dove immediately after the Camera finder and immediately before Owen.","The Compass finder went exactly 10 feet shallower than Priya.","Marcus explored neither the Kelp nor Trench zone.","The Trench dive happened immediately after the Cave dive.","The Coin finder dove later than the Compass finder, not necessarily immediately later.","Owen did not explore the Reef and did not find the Bell or Camera.","The Reef diver found the Compass, the Cave diver found the Bell, and the Trench diver found the Camera.","Priya went exactly 10 feet deeper than Marcus.","The Wreck dive happened immediately after the Kelp dive.","Nadia went exactly 10 feet deeper than Priya."],"solution":{"Elena":{"Dive Order":"4","Zone":"Kelp","Discovery":"Coin","Depth":"70 ft"},"Marcus":{"Dive Order":"1","Zone":"Reef","Discovery":"Compass","Depth":"40 ft"},"Nadia":{"Dive Order":"3","Zone":"Trench","Discovery":"Camera","Depth":"60 ft"},"Owen":{"Dive Order":"5","Zone":"Wreck","Discovery":"Tablet","Depth":"80 ft"},"Priya":{"Dive Order":"2","Zone":"Cave","Discovery":"Bell","Depth":"50 ft"}},"hint":"Build the depth relationships and the two immediate zone sequences separately, then connect them through the discoveries and dive order."}];const LEVELS=['Beginner','Easy','Medium','Hard','Expert'];let current=null,markMode='circle';
const $=id=>document.getElementById(id);const load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function show(id){const incoming=$(id),outgoing=id==='home'?$('game'):$('home');if(!outgoing.classList.contains('hidden')){outgoing.classList.add('screen-exit');setTimeout(()=>{outgoing.classList.add('hidden');outgoing.classList.remove('screen-exit');incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')},150)}else{incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')}}
function setPuzzleTheme(){const map={Beginner:['theme-market','🧺 Beginner Pack','🧺'],Easy:['theme-talent','🎭 Easy Pack','🎭'],Medium:['theme-hotel','🏨 Medium Pack','🏨'],Hard:['theme-lodge','❄️ Hard Pack','❄️'],Expert:['theme-desert','🏺 Expert Pack','🏺']};const game=$('game');game.classList.remove('theme-zoo','theme-pool','theme-museum','theme-kite','theme-ocean','theme-market','theme-talent','theme-hotel','theme-lodge','theme-desert');const t=map[current.level];game.classList.add(t[0]);$('themeBadge').textContent=t[1];return t}
function updateProgress(){if(!current)return;const st=load('state:'+current.id,{});let completed=0,total=0;current.slots.forEach(s=>current.categories.forEach(c=>{total++;const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');const crossed=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='cross');if(circ.length===1||crossed.length===current.values[c].length-1)completed++}));const pct=total?Math.round(completed/total*100):0;$('progressFill').style.width=pct+'%';$('progressPercent').textContent=pct+'%';$('progressFill').classList.toggle('solved',!!load('solved:'+current.id,false))}
function renderHome(){const box=$('levels');box.innerHTML='';LEVELS.forEach((level,li)=>{const arr=PUZZLES.filter(x=>x.level===level);const solved=arr.filter(p=>load('solved:'+p.id,false)).length;const b=document.createElement('button');b.className='level-card';b.innerHTML=`<strong>${level}</strong><br><small>${solved}/${arr.length} solved • Tap to choose a puzzle</small>`;b.addEventListener('click',()=>renderLevelBrowser(level));box.appendChild(b)})}
function renderLevelBrowser(level){const box=$('levels');box.innerHTML='';const back=document.createElement('button');back.className='level-card browser-back';back.innerHTML='<strong>← Difficulties</strong><br><small>Back to level selection</small>';back.addEventListener('click',renderHome);box.appendChild(back);PUZZLES.filter(p=>p.level===level).forEach((p,i)=>{const b=document.createElement('button');b.className='level-card puzzle-choice-card';b.innerHTML=`<strong>Puzzle ${i+1}</strong><br><small>${p.title}</small>${load('solved:'+p.id,false)?'<span class="solved-badge">✓ Solved</span>':''}`;b.addEventListener('click',()=>openPuzzle(p.id,true));box.appendChild(b)})}
function openPuzzle(id,withIntro=false){current=PUZZLES.find(p=>p.id===id);setPuzzleTheme();$('levelLabel').textContent=current.level;$('titleLabel').textContent=current.title;$('storyText').textContent=current.story;const used=load('clues:'+id,{});const list=$('cluesList');list.innerHTML='';current.clues.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.classList.toggle('used',!!used[i]);li.addEventListener('pointerup',e=>{e.preventDefault();const st=load('clues:'+id,{});st[i]=!st[i];save('clues:'+id,st);li.classList.toggle('used',!!st[i])});list.appendChild(li)});const sel=$('puzzleSelect');sel.innerHTML='';PUZZLES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.level+' — '+p.title;o.selected=p.id===id;sel.appendChild(o)});renderBoard();updateProgress();if(withIntro){const t=setPuzzleTheme();$('introIcon').textContent=t[2];$('introLevel').textContent=current.level;$('introTitle').textContent=current.title;$('introCard').classList.remove('hidden')}else show('game')}
function renderBoard(){const b=$('board'),st=load('state:'+current.id,{});b.innerHTML='';b.style.setProperty('--cols',current.slots.length);current.slots.forEach(slot=>{const col=document.createElement('section');col.className='column';col.innerHTML=`<h3>${slot}</h3>`;current.categories.forEach(cat=>{const sec=document.createElement('div');sec.className='cat';sec.innerHTML=`<div class="cat-title">${cat}</div>`;current.values[cat].forEach(v=>{const key=`${slot}|${cat}|${v}`,state=st[key]||'blank';const btn=document.createElement('button');btn.type='button';btn.className='choice '+state;btn.innerHTML=`<span>${v}</span>`;btn.addEventListener('pointerup',e=>{e.preventDefault();const s=load('state:'+current.id,{});s[key]=markMode==='erase'?'blank':markMode;save('state:'+current.id,s);renderBoard();updateProgress()});sec.appendChild(btn)});col.appendChild(sec)});b.appendChild(col)})}
function setMode(m){markMode=m;[['circle','circleMode'],['cross','crossMode'],['erase','eraseMode']].forEach(([x,id])=>{$(id).className='mode'+(x===m?' active '+x:'')})}
function note(t,k=''){$('notice').textContent=t;$('notice').className='notice '+k}
function progress(){const st=load('state:'+current.id,{});let marked=0,wrong=0;current.slots.forEach(s=>current.categories.forEach(c=>current.values[c].forEach(v=>{const x=st[`${s}|${c}|${v}`]||'blank';if(x==='blank')return;marked++;const right=current.solution[s][c]===v;if((x==='circle'&&!right)||(x==='cross'&&right))wrong++})));if(!marked)note('You have not marked anything yet.');else if(!wrong)note('Everything marked so far is correct.','ok');else note(`${wrong} mark${wrong===1?' is':'s are'} incorrect so far.`,'bad')}
function check(){const st=load('state:'+current.id,{});let complete=true,correct=true;current.slots.forEach(s=>current.categories.forEach(c=>{const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');if(circ.length!==1)complete=false;if(circ.length!==1||circ[0]!==current.solution[s][c])correct=false}));if(!complete)note('Circle one answer in every category for every column.');else if(correct){save('solved:'+current.id,true);$('progressFill').style.width='100%';$('progressPercent').textContent='100%';$('progressFill').classList.add('solved');note('Correct! You solved the puzzle.','ok');celebrate();}else note('Not quite. Review your deductions.','bad')}
function celebrate(){const layer=$('confettiLayer');layer.innerHTML='';for(let i=0;i<42;i++){const c=document.createElement('i');c.className='confetti';c.style.setProperty('--x',(Math.random()*100)+'vw');c.style.setProperty('--d',(-Math.random()*2.4)+'s');c.style.setProperty('--r',(Math.random()*180)+'deg');c.style.setProperty('--h',Math.floor(Math.random()*360));layer.appendChild(c)}$('winText').textContent=current.level+' — '+current.title;$('celebrate').classList.remove('hidden');renderHome()}
$('introGo').addEventListener('click',()=>{$('introCard').classList.add('hidden');show('game')});$('winContinue').addEventListener('click',()=>{$('celebrate').classList.add('hidden');show('home')});
$('homeBtn').addEventListener('click',()=>show('home'));$('circleMode').addEventListener('click',()=>setMode('circle'));$('crossMode').addEventListener('click',()=>setMode('cross'));$('eraseMode').addEventListener('click',()=>setMode('erase'));$('progressBtn').addEventListener('click',progress);$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',()=>note(current.hint));$('resetBtn').addEventListener('click',()=>{localStorage.removeItem('state:'+current.id);localStorage.removeItem('clues:'+current.id);openPuzzle(current.id)});$('puzzleSelect').addEventListener('change',e=>openPuzzle(e.target.value,true));renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
