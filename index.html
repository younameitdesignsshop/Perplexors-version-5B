function show(id){const incoming=$(id),outgoing=id==='home'?$('game'):$('home');if(!outgoing.classList.contains('hidden')){outgoing.classList.add('screen-exit');setTimeout(()=>{outgoing.classList.add('hidden');outgoing.classList.remove('screen-exit');incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')},150)}else{incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')}}
function setPuzzleTheme(){const map={'v6-beginner':['theme-pet','🐾 Pet Photo Theme'],'v6-easy':['theme-bakery','🧁 Bakery Theme'],'v6-medium':['theme-garden','🌻 Garden Theme'],'v6-hard':['theme-film','🎬 Film Festival Theme'],'v6-expert':['theme-mountain','🏔️ Mountain Theme']};const game=$('game');game.classList.remove('theme-pet','theme-bakery','theme-garden','theme-film','theme-mountain');const t=map[current.id]||['theme-pet','Puzzle Theme'];game.classList.add(t[0]);$('themeBadge').textContent=t[1]}
function updateProgress(){if(!current)return;const st=load('state:'+current.id,{});let completed=0,total=0;current.slots.forEach(s=>current.categories.forEach(c=>{total++;const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');const crossed=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='cross');if(circ.length===1||crossed.length===current.values[c].length-1)completed++}));const pct=total?Math.round(completed/total*100):0;$('progressFill').style.width=pct+'%';$('progressPercent').textContent=pct+'%'}
function renderHome(){const box=$('levels');box.innerHTML='';LEVELS.forEach(level=>{const p=PUZZLES.find(x=>x.level===level);const b=document.createElement('button');b.className='level-card';b.innerHTML=`<strong>${level}</strong><br><small>${p.title}</small>`;b.addEventListener('click',()=>openPuzzle(p.id));box.appendChild(b)})}
function openPuzzle(id){current=PUZZLES.find(p=>p.id===id);setPuzzleTheme();$('levelLabel').textContent=current.level;$('titleLabel').textContent=current.title;$('storyText').textContent=current.story;const used=load('clues:'+id,{});const list=$('cluesList');list.innerHTML='';current.clues.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.classList.toggle('used',!!used[i]);li.addEventListener('pointerup',e=>{e.preventDefault();const st=load('clues:'+id,{});st[i]=!st[i];save('clues:'+id,st);li.classList.toggle('used',!!st[i])});list.appendChild(li)});const sel=$('puzzleSelect');sel.innerHTML='';PUZZLES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.level+' — '+p.title;o.selected=p.id===id;sel.appendChild(o)});renderBoard();updateProgress();show('game')}
function renderBoard(){const b=$('board'),st=load('state:'+current.id,{});b.innerHTML='';b.style.setProperty('--cols',current.slots.length);current.slots.forEach(slot=>{const col=document.createElement('section');col.className='column';col.innerHTML=`<h3>${slot}</h3>`;current.categories.forEach(cat=>{const sec=document.createElement('div');sec.className='cat';sec.innerHTML=`<div class="cat-title">${cat}</div>`;current.values[cat].forEach(v=>{const key=`${slot}|${cat}|${v}`,state=st[key]||'blank';const btn=document.createElement('button');btn.type='button';btn.className='choice '+state;btn.innerHTML=`<span>${v}</span>`;btn.addEventListener('pointerup',e=>{e.preventDefault();const s=load('state:'+current.id,{});s[key]=markMode==='erase'?'blank':markMode;save('state:'+current.id,s);renderBoard();updateProgress()});sec.appendChild(btn)});col.appendChild(sec)});b.appendChild(col)})}
function setMode(m){markMode=m;[['circle','circleMode'],['cross','crossMode'],['erase','eraseMode']].forEach(([x,id])=>{$(id).className='mode'+(x===m?' active '+x:'')})}
function note(t,k=''){$('notice').textContent=t;$('notice').className='notice '+k}
function progress(){const st=load('state:'+current.id,{});let marked=0,wrong=0;current.slots.forEach(s=>current.categories.forEach(c=>current.values[c].forEach(v=>{const x=st[`${s}|${c}|${v}`]||'blank';if(x==='blank')return;marked++;const right=current.solution[s][c]===v;if((x==='circle'&&!right)||(x==='cross'&&right))wrong++})));if(!marked)note('You have not marked anything yet.');else if(!wrong)note('Everything marked so far is correct.','ok');else note(`${wrong} mark${wrong===1?' is':'s are'} incorrect so far.`,'bad')}
function check(){const st=load('state:'+current.id,{});let complete=true,correct=true;current.slots.forEach(s=>current.categories.forEach(c=>{const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');if(circ.length!==1)complete=false;if(circ.length!==1||circ[0]!==current.solution[s][c])correct=false}));if(!complete)note('Circle one answer in every category for every column.');else if(correct)note('Correct! You solved the puzzle.','ok');else note('Not quite. Review your deductions.','bad')}
$('homeBtn').addEventListener('click',()=>show('home'));$('circleMode').addEventListener('click',()=>setMode('circle'));$('crossMode').addEventListener('click',()=>setMode('cross'));$('eraseMode').addEventListener('click',()=>setMode('erase'));$('progressBtn').addEventListener('click',progress);$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',()=>note(current.hint));$('resetBtn').addEventListener('click',()=>{localStorage.removeItem('state:'+current.id);localStorage.removeItem('clues:'+current.id);openPuzzle(current.id)});$('puzzleSelect').addEventListener('change',e=>openPuzzle(e.target.value));renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
