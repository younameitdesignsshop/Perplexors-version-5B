/* VERSION 12 — one puzzle per level, varied logic structures */
.browser-back{background:linear-gradient(145deg,#f4f4f4,#dedede)!important}
.puzzle-choice-card{min-height:96px!important}.puzzle-choice-card::before{content:'🧩'!important;display:block!important;font-size:25px!important}

/* VERSION 12 — independent clue and answer scrolling */
@media (min-width:901px) and (orientation:landscape){
  #game{height:calc(100vh - 24px);overflow:hidden}
  #game .game-grid{height:calc(100vh - 190px);min-height:480px;align-items:stretch}
  #game .game-grid>aside,#game .game-grid>main{height:100%;min-height:0}
  #game .game-grid>aside{display:flex;flex-direction:column;overflow:hidden}
  #game .game-grid>aside .story{flex:0 0 auto;max-height:30%;overflow:auto}
  #game .game-grid>aside .clues{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:0}
  #game .game-grid>main{display:flex;flex-direction:column;overflow:hidden}
  #game .game-grid>main .tools{flex:0 0 auto}
  #game .game-grid>main .board{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #game .game-grid>main .actions,#game .game-grid>main .notice{flex:0 0 auto}
}

/* VERSION 12a — split-scroll iPad fix */
@media (min-width: 800px) and (orientation: landscape) {
  html, body {
    height: 100%;
    min-height: 100%;
  }

  #game.screen {
    min-height: 100vh;
    overflow: visible !important;
  }

  .v12-split,
  .puzzle-split,
  .game-split,
  .split-layout {
    align-items: stretch !important;
    min-height: 0 !important;
  }

  .v12-clue-panel,
  .clue-panel,
  .story-clues-panel,
  .left-panel {
    max-height: 72vh !important;
    height: 72vh !important;
    min-height: 540px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior: contain !important;
    touch-action: pan-y !important;
    padding-bottom: 32px !important;
  }

  .v12-board-panel,
  .answer-panel,
  .board-panel,
  .right-panel {
    max-height: 72vh !important;
    height: 72vh !important;
    min-height: 540px !important;
    overflow-y: auto !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior: contain !important;
    touch-action: pan-x pan-y !important;
    padding-bottom: 48px !important;
  }

  .v12-board-panel .board,
  .answer-panel .board,
  .board-panel .board,
  .right-panel .board,
  .v12-board-panel .grid,
  .answer-panel .grid,
  .board-panel .grid,
  .right-panel .grid {
    overflow: visible !important;
    min-height: max-content !important;
  }
}

function show(id){const incoming=$(id),outgoing=id==='home'?$('game'):$('home');if(!outgoing.classList.contains('hidden')){outgoing.classList.add('screen-exit');setTimeout(()=>{outgoing.classList.add('hidden');outgoing.classList.remove('screen-exit');incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')},150)}else{incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')}}

function updateProgress(){if(!current)return;const st=load('state:'+current.id,{});let completed=0,total=0;current.slots.forEach(s=>current.categories.forEach(c=>{total++;const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');const crossed=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='cross');if(circ.length===1||crossed.length===current.values[c].length-1)completed++}));const pct=total?Math.round(completed/total*100):0;$('progressFill').style.width=pct+'%';$('progressPercent').textContent=pct+'%';$('progressFill').classList.toggle('solved',!!load('solved:'+current.id,false))}

function openPuzzle(id,withIntro=false){current=PUZZLES.find(p=>p.id===id);setPuzzleTheme();$('levelLabel').textContent=current.level;$('titleLabel').textContent=current.title;$('storyText').textContent=current.story;const used=load('clues:'+id,{});const list=$('cluesList');list.innerHTML='';current.clues.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.classList.toggle('used',!!used[i]);li.addEventListener('pointerup',e=>{e.preventDefault();const st=load('clues:'+id,{});st[i]=!st[i];save('clues:'+id,st);li.classList.toggle('used',!!st[i])});list.appendChild(li)});const sel=$('puzzleSelect');sel.innerHTML='';PUZZLES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.level+' — '+p.title;o.selected=p.id===id;sel.appendChild(o)});renderBoard();updateProgress();if(withIntro){const t=setPuzzleTheme();$('introIcon').textContent=t[2];$('introLevel').textContent=current.level;$('introTitle').textContent=current.title;$('introCard').classList.remove('hidden')}else show('game')}

function progress(){const st=load('state:'+current.id,{});let marked=0,wrong=0;current.slots.forEach(s=>current.categories.forEach(c=>current.values[c].forEach(v=>{const x=st[`${s}|${c}|${v}`]||'blank';if(x==='blank')return;marked++;const right=current.solution[s][c]===v;if((x==='circle'&&!right)||(x==='cross'&&right))wrong++})));if(!marked)note('You have not marked anything yet.');else if(!wrong)note('Everything marked so far is correct.','ok');else note(`${wrong} mark${wrong===1?' is':'s are'} incorrect so far.`,'bad')}
