/* VERSION 12 — one puzzle per level, varied logic structures */
.browser-back{background:linear-gradient(145deg,#f4f4f4,#dedede)!important}
.puzzle-choice-card{min-height:96px!important}.puzzle-choice-card::before{content:'🧩'!important;display:block!important;font-size:25px!important}

/* VERSION 12 — independent clue and answer scrolling */
@media (min-width:901px) and (orientation:landscape){
  #game{height:calc(100vh - 24px);overflow:hidden}
  #game .game-grid{height:calc(100vh - 190px);min-height:480px;align-items:stretch}
  #game .game-grid>aside,#game .game-grid>main{height:100%;min-height:0}
  #game .game-grid>aside{display:flex;flex-direction:column;overflow:hidden}
  #game .game-grid>aside .story{flex:0 0 auto;max-height:30%;overflow:auto}
  #game .game-grid>aside .clues{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:0}
  #game .game-grid>main{display:flex;flex-direction:column;overflow:hidden}
  #game .game-grid>main .tools{flex:0 0 auto}
  #game .game-grid>main .board{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #game .game-grid>main .actions,#game .game-grid>main .notice{flex:0 0 auto}
}

/* VERSION 12a — split-scroll iPad fix */
@media (min-width: 800px) and (orientation: landscape) {
  html, body {
    height: 100%;
    min-height: 100%;
  }

  #game.screen {
    min-height: 100vh;
    overflow: visible !important;
  }

  .v12-split,
  .puzzle-split,
  .game-split,
  .split-layout {
    align-items: stretch !important;
    min-height: 0 !important;
  }

  .v12-clue-panel,
  .clue-panel,
  .story-clues-panel,
  .left-panel {
    max-height: 72vh !important;
    height: 72vh !important;
    min-height: 540px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior: contain !important;
    touch-action: pan-y !important;
    padding-bottom: 32px !important;
  }

  .v12-board-panel,
  .answer-panel,
  .board-panel,
  .right-panel {
    max-height: 72vh !important;
    height: 72vh !important;
    min-height: 540px !important;
    overflow-y: auto !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior: contain !important;
    touch-action: pan-x pan-y !important;
    padding-bottom: 48px !important;
  }

  .v12-board-panel .board,
  .answer-panel .board,
  .board-panel .board,
  .right-panel .board,
  .v12-board-panel .grid,
  .answer-panel .grid,
  .board-panel .grid,
  .right-panel .grid {
    overflow: visible !important;
    min-height: max-content !important;
  }
}

function progress(){const st=load('state:'+current.id,{});let marked=0,wrong=0;current.slots.forEach(s=>current.categories.forEach(c=>current.values[c].forEach(v=>{const x=st[`${s}|${c}|${v}`]||'blank';if(x==='blank')return;marked++;const right=current.solution[s][c]===v;if((x==='circle'&&!right)||(x==='cross'&&right))wrong++})));if(!marked)note('You have not marked anything yet.');else if(!wrong)note('Everything marked so far is correct.','ok');else note(`${wrong} mark${wrong===1?' is':'s are'} incorrect so far.`,'bad')}
function check(){const st=load('state:'+current.id,{});let complete=true,correct=true;current.slots.forEach(s=>current.categories.forEach(c=>{const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');if(circ.length!==1)complete=false;if(circ.length!==1||circ[0]!==current.solution[s][c])correct=false}));if(!complete)note('Circle one answer in every category for every column.');else if(correct){save('solved:'+current.id,true);$('progressFill').style.width='100%';$('progressPercent').textContent='100%';$('progressFill').classList.add('solved');note('Correct! You solved the puzzle.','ok');celebrate();}else note('Not quite. Review your deductions.','bad')}
function celebrate(){const layer=$('confettiLayer');layer.innerHTML='';for(let i=0;i<42;i++){const c=document.createElement('i');c.className='confetti';c.style.setProperty('--x',(Math.random()*100)+'vw');c.style.setProperty('--d',(-Math.random()*2.4)+'s');c.style.setProperty('--r',(Math.random()*180)+'deg');c.style.setProperty('--h',Math.floor(Math.random()*360));layer.appendChild(c)}$('winText').textContent=current.level+' — '+current.title;$('celebrate').classList.remove('hidden');renderHome()}
$('introGo').addEventListener('click',()=>{$('introCard').classList.add('hidden');show('game')});$('winContinue').addEventListener('click',()=>{$('celebrate').classList.add('hidden');show('home')});
$('homeBtn').addEventListener('click',()=>show('home'));$('circleMode').addEventListener('click',()=>setMode('circle'));$('crossMode').addEventListener('click',()=>setMode('cross'));$('eraseMode').addEventListener('click',()=>setMode('erase'));$('progressBtn').addEventListener('click',progress);$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',()=>note(current.hint));$('resetBtn').addEventListener('click',()=>{localStorage.removeItem('state:'+current.id);localStorage.removeItem('clues:'+current.id);openPuzzle(current.id)});$('puzzleSelect').addEventListener('change',e=>openPuzzle(e.target.value,true));renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script><div style="display:none" id="build-marker">v15b-20260816 solver-validated</div></body></html>
