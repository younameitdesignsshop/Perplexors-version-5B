ishing order."},{"id":"v10-expert-5","level":"Expert","title":"International Art Expo","story":"5 participants\u2014Flynn, Damon, Greer, Celia, and Esme\u2014each had a different gallery, a different artwork, and a different finish time. The times were 4:00, 4:20, 4:40, 5:00, and 5:20, listed from earliest to latest. The order of the names below does not indicate finishing order.","slots":["Flynn","Damon","Greer","Celia","Esme"],"categories":["Time","Gallery","Artwork"],"values":{"Time":["4:00","4:20","4:40","5:00","5:20"],"Gallery":["Loft","Atrium","Pavilion","EastWing","Studio"],"Artwork":["Sculpture","Mosaic","Collage","Textile","Portrait"]},"clues":["Damon finished before Esme, not necessarily immediately before.","Flynn finished before Greer, not necessarily immediately before.","The eastwing gallery was paired with the Collage artwork.","The studio gallery finished before the Collage artwork, not necessarily immediately before.","Esme had neither Studio nor Pavilion as the gallery.","The textile artwork finished immediately after Celia.","Celia had neither Loft nor Pavilion as the gallery.","Flynn had neither Portrait nor Sculpture as the artwork.","The mosaic artwork finished immediately after the Atrium gallery.","The atrium gallery was paired with the Textile artwork.","The textile artwork finished before the Pavilion gallery, not necessarily immediately before.","Flynn finished immediately after the Mosaic artwork.","The pavilion gallery finished exactly 80 minutes after the Portrait artwork.","The portrait artwork finished before the Atrium gallery, not necessarily immediately before.","Esme finished before Greer, not necessarily immediately before.","Damon had neither Collage nor Sculpture as the artwork.","Greer had neither Studio nor EastWing as the gallery."],"solution":{"Celia":{"Time":"4:00","Gallery":"Studio","Artwork":"Portrait"},"Damon":{"Time":"4:20","Gallery":"Atrium","Artwork":"Textile"},"Esme":{"Time":"4:40","Gallery":"Loft","Artwork":"Mosaic"},"Flynn":{"Time":"5:00","Gallery":"EastWing","Artwork":"Collage"},"Greer":{"Time":"5:20","Gallery":"Pavilion","Artwork":"Sculpture"}},"hint":"Combine the relationship clues across categories and time. Do not assume the displayed name order is the finishing order."}];const LEVELS=['Beginner','Easy','Medium','Hard','Expert'];let current=null,markMode='circle';
const $=id=>document.getElementById(id);const load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function show(id){const incoming=$(id),outgoing=id==='home'?$('game'):$('home');if(!outgoing.classList.contains('hidden')){outgoing.classList.add('screen-exit');setTimeout(()=>{outgoing.classList.add('hidden');outgoing.classList.remove('screen-exit');incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')},150)}else{incoming.classList.remove('hidden');incoming.classList.remove('screen-enter');void incoming.offsetWidth;incoming.classList.add('screen-enter')}}
function setPuzzleTheme(){const map={Beginner:['theme-market','🧺 Beginner Pack','🧺'],Easy:['theme-talent','🎭 Easy Pack','🎭'],Medium:['theme-hotel','🏨 Medium Pack','🏨'],Hard:['theme-lodge','❄️ Hard Pack','❄️'],Expert:['theme-desert','🏺 Expert Pack','🏺']};const game=$('game');game.classList.remove('theme-zoo','theme-pool','theme-museum','theme-kite','theme-ocean','theme-market','theme-talent','theme-hotel','theme-lodge','theme-desert');const t=map[current.level];game.classList.add(t[0]);$('themeBadge').textContent=t[1];return t}
function updateProgress(){if(!current)return;const st=load('state:'+current.id,{});let completed=0,total=0;current.slots.forEach(s=>current.categories.forEach(c=>{total++;const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');const crossed=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='cross');if(circ.length===1||crossed.length===current.values[c].length-1)completed++}));const pct=total?Math.round(completed/total*100):0;$('progressFill').style.width=pct+'%';$('progressPercent').textContent=pct+'%';$('progressFill').classList.toggle('solved',!!load('solved:'+current.id,false))}
function renderHome(){const box=$('levels');box.innerHTML='';LEVELS.forEach((level,li)=>{const arr=PUZZLES.filter(x=>x.level===level);const solved=arr.filter(p=>load('solved:'+p.id,false)).length;const b=document.createElement('button');b.className='level-card';b.innerHTML=`<strong>${level}</strong><br><small>${solved}/5 solved • Tap to choose a puzzle</small>`;b.addEventListener('click',()=>renderLevelBrowser(level));box.appendChild(b)})}
function renderLevelBrowser(level){const box=$('levels');box.innerHTML='';const back=document.createElement('button');back.className='level-card browser-back';back.innerHTML='<strong>← Difficulties</strong><br><small>Back to level selection</small>';back.addEventListener('click',renderHome);box.appendChild(back);PUZZLES.filter(p=>p.level===level).forEach((p,i)=>{const b=document.createElement('button');b.className='level-card puzzle-choice-card';b.innerHTML=`<strong>Puzzle ${i+1}</strong><br><small>${p.title}</small>${load('solved:'+p.id,false)?'<span class="solved-badge">✓ Solved</span>':''}`;b.addEventListener('click',()=>openPuzzle(p.id,true));box.appendChild(b)})}
function openPuzzle(id,withIntro=false){current=PUZZLES.find(p=>p.id===id);setPuzzleTheme();$('levelLabel').textContent=current.level;$('titleLabel').textContent=current.title;$('storyText').textContent=current.story;const used=load('clues:'+id,{});const list=$('cluesList');list.innerHTML='';current.clues.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.classList.toggle('used',!!used[i]);li.addEventListener('pointerup',e=>{e.preventDefault();const st=load('clues:'+id,{});st[i]=!st[i];save('clues:'+id,st);li.classList.toggle('used',!!st[i])});list.appendChild(li)});const sel=$('puzzleSelect');sel.innerHTML='';PUZZLES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.level+' — '+p.title;o.selected=p.id===id;sel.appendChild(o)});renderBoard();updateProgress();if(withIntro){const t=setPuzzleTheme();$('introIcon').textContent=t[2];$('introLevel').textContent=current.level;$('introTitle').textContent=current.title;$('introCard').classList.remove('hidden')}else show('game')}
function renderBoard(){const b=$('board'),st=load('state:'+current.id,{});b.innerHTML='';b.style.setProperty('--cols',current.slots.length);current.slots.forEach(slot=>{const col=document.createElement('section');col.className='column';col.innerHTML=`<h3>${slot}</h3>`;current.categories.forEach(cat=>{const sec=document.createElement('div');sec.className='cat';sec.innerHTML=`<div class="cat-title">${cat}</div>`;current.values[cat].forEach(v=>{const key=`${slot}|${cat}|${v}`,state=st[key]||'blank';const btn=document.createElement('button');btn.type='button';btn.className='choice '+state;btn.innerHTML=`<span>${v}</span>`;btn.addEventListener('pointerup',e=>{e.preventDefault();const s=load('state:'+current.id,{});s[key]=markMode==='erase'?'blank':markMode;save('state:'+current.id,s);renderBoard();updateProgress()});sec.appendChild(btn)});col.appendChild(sec)});b.appendChild(col)})}
function setMode(m){markMode=m;[['circle','circleMode'],['cross','crossMode'],['erase','eraseMode']].forEach(([x,id])=>{$(id).className='mode'+(x===m?' active '+x:'')})}
function note(t,k=''){$('notice').textContent=t;$('notice').className='notice '+k}
function progress(){const st=load('state:'+current.id,{});let marked=0,wrong=0;current.slots.forEach(s=>current.categories.forEach(c=>current.values[c].forEach(v=>{const x=st[`${s}|${c}|${v}`]||'blank';if(x==='blank')return;marked++;const right=current.solution[s][c]===v;if((x==='circle'&&!right)||(x==='cross'&&right))wrong++})));if(!marked)note('You have not marked anything yet.');else if(!wrong)note('Everything marked so far is correct.','ok');else note(`${wrong} mark${wrong===1?' is':'s are'} incorrect so far.`,'bad')}
function check(){const st=load('state:'+current.id,{});let complete=true,correct=true;current.slots.forEach(s=>current.categories.forEach(c=>{const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');if(circ.length!==1)complete=false;if(circ.length!==1||circ[0]!==current.solution[s][c])correct=false}));if(!complete)note('Circle one answer in every category for every column.');else if(correct){save('solved:'+current.id,true);$('progressFill').style.width='100%';$('progressPercent').textContent='100%';$('progressFill').classList.add('solved');note('Correct! You solved the puzzle.','ok');celebrate();}else note('Not quite. Review your deductions.','bad')}
function celebrate(){const layer=$('confettiLayer');layer.innerHTML='';for(let i=0;i<42;i++){const c=document.createElement('i');c.className='confetti';c.style.setProperty('--x',(Math.random()*100)+'vw');c.style.setProperty('--d',(-Math.random()*2.4)+'s');c.style.setProperty('--r',(Math.random()*180)+'deg');c.style.setProperty('--h',Math.floor(Math.random()*360));layer.appendChild(c)}$('winText').textContent=current.level+' — '+current.title;$('celebrate').classList.remove('hidden');renderHome()}
$('introGo').addEventListener('click',()=>{$('introCard').classList.add('hidden');show('game')});$('winContinue').addEventListener('click',()=>{$('celebrate').classList.add('hidden');show('home')});
$('homeBtn').addEventListener('click',()=>show('home'));$('circleMode').addEventListener('click',()=>setMode('circle'));$('crossMode').addEventListener('click',()=>setMode('cross'));$('eraseMode').addEventListener('click',()=>setMode('erase'));$('progressBtn').addEventListener('click',progress);$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',()=>note(current.hint));$('resetBtn').addEventListener('click',()=>{localStorage.removeItem('state:'+current.id);localStorage.removeItem('clues:'+current.id);openPuzzle(current.id)});$('puzzleSelect').addEventListener('change',e=>openPuzzle(e.target.value,true));renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
