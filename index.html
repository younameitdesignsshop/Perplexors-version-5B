<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b4636"><link rel="manifest" href="manifest.webmanifest"><title>Deduction Columns</title><style>
:root{--paper:#f5efe2;--ink:#2a241f;--muted:#74685f;--line:#baa995;--panel:#fffaf1;--brown:#5b4636;--green:#dff2e2;--red:#f7dddd;--gray:#e7e7e7;--blue:#2466cc}
*{box-sizing:border-box}html,body{margin:0;background:#d5cec5;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,select{font:inherit}.app{max-width:1366px;margin:auto;padding:8px}.sheet{background:var(--paper);min-height:calc(100vh - 16px);border-radius:14px;padding:11px;box-shadow:0 8px 28px #0002}.hidden{display:none!important}.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 11px}.primary{background:var(--brown);color:#fff}.hero{background:#302820;color:white;border-radius:12px;padding:15px}.hero h1{margin:0 0 4px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.level-card{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:14px;text-align:left;min-height:88px}.game-head,.tools,.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:space-between}.game-grid{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(620px,1.8fr);gap:10px;margin-top:8px}.story{font-size:13px;line-height:1.18;border-bottom:1px solid var(--line);padding-bottom:4px}.clues{font-size:13px;line-height:1.14;padding-left:21px}.clues li{margin-bottom:3px;touch-action:manipulation}.clues li.used{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.58}.mode{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px}.mode.active.circle{background:var(--green);border-color:#68a774}.mode.active.cross{background:var(--red);border-color:#c27272}.mode.active.erase{background:var(--gray);border-color:#999}.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(112px,1fr));gap:4px}.column{border-left:1px solid var(--line);padding:0 4px}.column:first-child{border-left:0}.column h3{text-align:center;font-size:14px;margin:0 0 3px}.cat{margin-bottom:4px}.cat-title{font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid #d4c7b7}.choice{display:block;width:100%;border:0;background:transparent;text-align:left;color:var(--blue);padding:1px 2px;min-height:24px;touch-action:manipulation;-webkit-user-select:none;user-select:none}.choice.circle span{display:inline-block;border:2px solid #111;border-radius:999px;padding:0 5px}.choice.cross span{position:relative;display:inline-block}.choice.cross span::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:#000;transform:translateY(-50%);pointer-events:none}.notice{margin-top:7px;padding:8px;border-radius:7px;background:#eadcc8}.ok{background:#dceedd}.bad{background:#f3dede}@media(max-width:900px),(orientation:portrait){.levels{grid-template-columns:repeat(2,1fr)}.game-grid{grid-template-columns:1fr}.board{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}}

:root{--appCard:#fffaf2;--appShadow:0 12px 28px rgba(64,43,27,.15)}
body{background:linear-gradient(145deg,#d6cec4,#eee7df)!important}
.sheet{border-radius:22px!important;box-shadow:var(--appShadow)!important;overflow:hidden}
#home::before{content:"Deduction Columns";display:block;background:linear-gradient(135deg,#7d5a3c,#59402c);color:white;font-size:30px;font-weight:700;padding:22px;border-radius:18px;margin-bottom:12px;box-shadow:0 10px 22px rgba(65,43,26,.2)}
#home::after{content:"Circle it. Cross it out. Solve it.";display:block;color:#fff;position:absolute;top:62px;left:34px;font-size:14px;opacity:.85}
#home{position:relative}
.home-grid button,.pack{border-radius:16px!important;background:var(--appCard)!important;box-shadow:0 5px 14px rgba(70,45,25,.08)!important;transition:transform .15s ease}
.home-grid button:active,.pack:active{transform:scale(.985)}
#game{background:rgba(255,250,242,.6);border-radius:18px;padding:10px}
.game-header,.top{background:var(--appCard);border-radius:14px;padding:9px;box-shadow:0 4px 12px rgba(70,45,25,.07)}
.screen{animation:v5in .18s ease}@keyframes v5in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

</style></head><body><div class="app"><div class="sheet">
<section id="home"><div class="hero"><h1>Deduction Columns</h1><div>Version 5 Corrections · Workbook-style deduction puzzles</div></div><div class="levels" id="levels"></div></section>
<section id="game" class="hidden"><div class="game-head"><button id="homeBtn" class="btn">← Home</button><div><small id="levelLabel"></small><h2 id="titleLabel" style="margin:0"></h2></div><select id="puzzleSelect" class="btn"></select></div><div class="game-grid"><aside><h3>The Story</h3><p id="storyText" class="story"></p><h3>The Clues</h3><ol id="cluesList" class="clues"></ol></aside><main><div class="tools"><span>Apple Pencil mode:</span><button id="circleMode" class="mode active circle">Circle</button><button id="crossMode" class="mode">Strike Through</button><button id="eraseMode" class="mode">Erase</button></div><div id="board" class="board"></div><div class="actions"><button id="progressBtn" class="btn">Check My Progress</button><button id="checkBtn" class="btn primary">Check Answer</button><button id="hintBtn" class="btn">Hint</button><button id="resetBtn" class="btn">Reset</button></div><div id="notice" class="notice hidden"></div></main></div></section>
</div></div><script>
const PUZZLES=[{"id":"beginner-1","level":"Beginner","title":"Ice Cream Parade","story":"Four children each chose a different flavor and finished in a different parade position.","slots":["Ava","Ben","Cara","Drew"],"categories":["Parade Position","Flavor"],"values":{"Parade Position":["1st","2nd","3rd","4th"],"Flavor":["Chocolate","Mint","Strawberry","Vanilla"]},"clues":["Ava finished before Ben.","The mint cone was carried immediately before the strawberry cone.","Cara carried the mint cone.","Drew finished 4th and carried the strawberry cone.","The vanilla cone was carried by the child in 1st place."],"solution":{"Ava":{"Parade Position":"1st","Flavor":"Vanilla"},"Ben":{"Parade Position":"2nd","Flavor":"Chocolate"},"Cara":{"Parade Position":"3rd","Flavor":"Mint"},"Drew":{"Parade Position":"4th","Flavor":"Strawberry"}},"hint":"Start with Drew and the vanilla clue, then use the immediate-before clue."},{"id":"easy-1","level":"Easy","title":"Farmers Market Finds","story":"Four shoppers each bought a different item and paid a different amount.","slots":["Ella","Finn","Grace","Hugo"],"categories":["Purchase","Price"],"values":{"Purchase":["Apples","Bread","Cheese","Flowers"],"Price":["$4","$6","$8","$10"]},"clues":["The bread cost $2 more than the apples.","Grace spent more than Finn but less than Hugo.","Ella did not buy flowers or cheese.","The cheese cost $10.","Finn spent $4.","The flowers cost more than the bread."],"solution":{"Ella":{"Purchase":"Bread","Price":"$6"},"Finn":{"Purchase":"Apples","Price":"$4"},"Grace":{"Purchase":"Flowers","Price":"$8"},"Hugo":{"Purchase":"Cheese","Price":"$10"}},"hint":"Place Finn and the cheese first, then use the price relationships."},{"id":"medium-1","level":"Medium","title":"Museum Afternoon","story":"Four visitors each toured a different exhibit, bought a different souvenir, and arrived at a different time.","slots":["Iris","Jonah","Keira","Liam"],"categories":["Exhibit","Souvenir","Arrival Time"],"values":{"Exhibit":["Art","Dinosaurs","Gems","Space"],"Souvenir":["Book","Keychain","Mug","Poster"],"Arrival Time":["1:00","1:30","2:00","2:30"]},"clues":["The visitor who toured the gems exhibit arrived one hour after Jonah.","The poster buyer arrived at 1:30.","Keira bought neither the book nor the mug.","The dinosaur visitor arrived before the person who bought the mug.","The art visitor arrived before Jonah, and Iris arrived before Liam.","The space visitor bought the keychain.","Jonah did not tour art or space."],"solution":{"Iris":{"Exhibit":"Art","Souvenir":"Book","Arrival Time":"1:00"},"Jonah":{"Exhibit":"Dinosaurs","Souvenir":"Poster","Arrival Time":"1:30"},"Keira":{"Exhibit":"Space","Souvenir":"Keychain","Arrival Time":"2:00"},"Liam":{"Exhibit":"Gems","Souvenir":"Mug","Arrival Time":"2:30"}},"hint":"Use the art/Jonah ordering clue with the gems timing clue, then connect the space exhibit to the keychain."},{"id":"hard-1","level":"Hard","title":"Charity Auction","story":"Five bidders each won a different item, paid a different amount, and finished in a different bidding position.","slots":["Maya","Noah","Owen","Priya","Quinn"],"categories":["Auction Position","Item","Winning Bid"],"values":{"Auction Position":["1st","2nd","3rd","4th","5th"],"Item":["Camera","Lamp","Painting","Watch","Wine"],"Winning Bid":["$40","$50","$60","$70","$80"]},"clues":["The painting sold in 3rd place, immediately before the watch.","Priya paid $50 and finished immediately before Quinn.","Maya neither won the camera nor paid $80.","The lamp sold for $20 less than the wine.","Noah finished either 1st or 5th.","Owen paid more than Maya but less than Quinn.","The camera sold for $40.","Maya finished before Owen, and Priya won neither the lamp nor the wine."],"solution":{"Maya":{"Auction Position":"2nd","Item":"Lamp","Winning Bid":"$60"},"Noah":{"Auction Position":"1st","Item":"Camera","Winning Bid":"$40"},"Owen":{"Auction Position":"3rd","Item":"Painting","Winning Bid":"$70"},"Priya":{"Auction Position":"4th","Item":"Watch","Winning Bid":"$50"},"Quinn":{"Auction Position":"5th","Item":"Wine","Winning Bid":"$80"}},"hint":"Use Priya and Quinn's consecutive positions with the painting/watch clue, then solve the bid chain."},{"id":"expert-1","level":"Expert","title":"Archaeology Expedition","story":"Five archaeologists each worked at a different excavation depth, found a different artifact, and used a different tool.","slots":["Rosa","Samir","Tessa","Uri","Vera"],"categories":["Excavation Depth","Artifact","Primary Tool"],"values":{"Excavation Depth":["5 ft (Shallowest)","10 ft","15 ft","20 ft","25 ft (Deepest)"],"Artifact":["Amulet","Coin","Jar","Mask","Tablet"],"Primary Tool":["Brush","Chisel","Pick","Sieve","Trowel"]},"clues":["The tablet was found 5 feet deeper than the coin.","The archaeologist using the sieve worked shallower than Tessa but deeper than Rosa.","Uri found neither the amulet nor the jar.","The mask was found at the deepest level.","Samir worked immediately deeper than the person using the brush, but Samir did not work at the deepest level.","The jar was found by the archaeologist using the trowel.","Vera worked deeper than Uri and did not use the trowel.","The chisel user found the coin, and Samir used neither the sieve nor the trowel."],"solution":{"Rosa":{"Excavation Depth":"5 ft (Shallowest)","Artifact":"Amulet","Primary Tool":"Brush"},"Samir":{"Excavation Depth":"10 ft","Artifact":"Coin","Primary Tool":"Chisel"},"Tessa":{"Excavation Depth":"20 ft","Artifact":"Jar","Primary Tool":"Trowel"},"Uri":{"Excavation Depth":"15 ft","Artifact":"Tablet","Primary Tool":"Sieve"},"Vera":{"Excavation Depth":"25 ft (Deepest)","Artifact":"Mask","Primary Tool":"Pick"}},"hint":"Use the clearly ordered depths. Start with the mask, then combine the brush/Samir clue with the tablet/coin relationship."}];const LEVELS=['Beginner','Easy','Medium','Hard','Expert'];let current=null,markMode='circle';
const $=id=>document.getElementById(id);const load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function show(id){$('home').classList.toggle('hidden',id!=='home');$('game').classList.toggle('hidden',id!=='game')}
function renderHome(){const box=$('levels');box.innerHTML='';LEVELS.forEach(level=>{const p=PUZZLES.find(x=>x.level===level);const b=document.createElement('button');b.className='level-card';b.innerHTML=`<strong>${level}</strong><br><small>${p.title}</small>`;b.addEventListener('click',()=>openPuzzle(p.id));box.appendChild(b)})}
function openPuzzle(id){current=PUZZLES.find(p=>p.id===id);$('levelLabel').textContent=current.level;$('titleLabel').textContent=current.title;$('storyText').textContent=current.story;const used=load('clues:'+id,{});const list=$('cluesList');list.innerHTML='';current.clues.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.classList.toggle('used',!!used[i]);li.addEventListener('pointerup',e=>{e.preventDefault();const st=load('clues:'+id,{});st[i]=!st[i];save('clues:'+id,st);li.classList.toggle('used',!!st[i])});list.appendChild(li)});const sel=$('puzzleSelect');sel.innerHTML='';PUZZLES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.level+' — '+p.title;o.selected=p.id===id;sel.appendChild(o)});renderBoard();show('game')}
function renderBoard(){const b=$('board'),st=load('state:'+current.id,{});b.innerHTML='';b.style.setProperty('--cols',current.slots.length);current.slots.forEach(slot=>{const col=document.createElement('section');col.className='column';col.innerHTML=`<h3>${slot}</h3>`;current.categories.forEach(cat=>{const sec=document.createElement('div');sec.className='cat';sec.innerHTML=`<div class="cat-title">${cat}</div>`;current.values[cat].forEach(v=>{const key=`${slot}|${cat}|${v}`,state=st[key]||'blank';const btn=document.createElement('button');btn.type='button';btn.className='choice '+state;btn.innerHTML=`<span>${v}</span>`;btn.addEventListener('pointerup',e=>{e.preventDefault();const s=load('state:'+current.id,{});s[key]=markMode==='erase'?'blank':markMode;save('state:'+current.id,s);renderBoard()});sec.appendChild(btn)});col.appendChild(sec)});b.appendChild(col)})}
function setMode(m){markMode=m;[['circle','circleMode'],['cross','crossMode'],['erase','eraseMode']].forEach(([x,id])=>{$(id).className='mode'+(x===m?' active '+x:'')})}
function note(t,k=''){$('notice').textContent=t;$('notice').className='notice '+k}
function progress(){const st=load('state:'+current.id,{});let marked=0,wrong=0;current.slots.forEach(s=>current.categories.forEach(c=>current.values[c].forEach(v=>{const x=st[`${s}|${c}|${v}`]||'blank';if(x==='blank')return;marked++;const right=current.solution[s][c]===v;if((x==='circle'&&!right)||(x==='cross'&&right))wrong++})));if(!marked)note('You have not marked anything yet.');else if(!wrong)note('Everything marked so far is correct.','ok');else note(`${wrong} mark${wrong===1?' is':'s are'} incorrect so far.`,'bad')}
function check(){const st=load('state:'+current.id,{});let complete=true,correct=true;current.slots.forEach(s=>current.categories.forEach(c=>{const circ=current.values[c].filter(v=>st[`${s}|${c}|${v}`]==='circle');if(circ.length!==1)complete=false;if(circ.length!==1||circ[0]!==current.solution[s][c])correct=false}));if(!complete)note('Circle one answer in every category for every column.');else if(correct)note('Correct! You solved the puzzle.','ok');else note('Not quite. Review your deductions.','bad')}
$('homeBtn').addEventListener('click',()=>show('home'));$('circleMode').addEventListener('click',()=>setMode('circle'));$('crossMode').addEventListener('click',()=>setMode('cross'));$('eraseMode').addEventListener('click',()=>setMode('erase'));$('progressBtn').addEventListener('click',progress);$('checkBtn').addEventListener('click',check);$('hintBtn').addEventListener('click',()=>note(current.hint));$('resetBtn').addEventListener('click',()=>{localStorage.removeItem('state:'+current.id);localStorage.removeItem('clues:'+current.id);openPuzzle(current.id)});$('puzzleSelect').addEventListener('change',e=>openPuzzle(e.target.value));renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
